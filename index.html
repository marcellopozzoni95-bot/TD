<body>
    <div id="diag" style="position:fixed;left:8px;bottom:8px;right:8px;z-index:99999;color:#ff6;font:12px monospace;white-space:pre-wrap;pointer-events:none"></div>
    <script>
      (function(){
        var d=document.getElementById('diag'), t0=Date.now();
        window.__diag=function(m){ d.textContent += m + "\n"; };
        window.addEventListener('error',function(e){ __diag('ERRORE: '+(e.message||'')+' '+(e.filename||(e.target&&(e.target.src||e.target.href))||'')+':'+(e.lineno||'')); },true);
        window.addEventListener('unhandledrejection',function(e){ __diag('PROMISE: '+(e.reason&&(e.reason.stack||e.reason.message)||e.reason)); });
        __diag('HTML ok - '+navigator.userAgent.replace(/.*OS ([\d_]+).*/,'iOS $1'));
        setTimeout(function(){ if(!document.querySelector('#screen *')) __diag('Dopo 25s il gioco non e partito (JS non avviato)'); else d.textContent=''; },25000);
      })();
    </script>

   <div id="view-port">
        <div id="screen-root">
            <div id="screen"></div>
        </div>
    </div>
    <script>
      (function(){
        var started = false;
        function start(){
          if (started) return; started = true;
          var s = document.createElement('script'); s.type = 'module'; s.src = './src/js/bootstrap.js';
          document.body.appendChild(s);
        }
        if (!('serviceWorker' in navigator)) return start();
        // Primo avvio: aspetta che il codice sia salvato per l'offline, poi avvia il gioco
        if (navigator.serviceWorker.controller) start();
        else {
          navigator.serviceWorker.addEventListener('controllerchange', start);
          setTimeout(start, 60000);
        }
        navigator.serviceWorker.register('./sw.js').catch(function(e){ window.__diag && __diag('SW: ' + e); start(); });
      })();
    </script>
</body>
